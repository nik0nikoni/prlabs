version: "3.9"

services:
  db:
    image: postgres:15
    container_name: chatbot_db
    restart: always
    environment:
      POSTGRES_DB: todo
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: chatbot_backend
    restart: always
    depends_on:
      - db
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  bot:
    build: .
    container_name: chatbot_bot
    restart: always
    depends_on:
      - backend
    command: python -m app.bot.bot

volumes:
  postgres_data: